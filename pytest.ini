[pytest]
# Qwen3-TTS/ 是外部 clone 進來的原始碼（見 docs/tts-setup.md），
# 裡面自帶的 examples/test_*.py 不是我們的測試，會撞到 import 錯誤。
norecursedirs = Qwen3-TTS .venv models

# core/recording_analysis/live_conversation 互相 import（例如
# recording_analysis/test_seed_baseline.py 會 import core/scoring.py），
# 三個資料夾都要在 sys.path 上，測試才 import 得到彼此。
pythonpath = core recording_analysis live_conversation
